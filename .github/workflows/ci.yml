name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prompt_ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Check Alembic migration chain (no multiple heads)
      run: |
        python - <<'EOF'
        import os, re, sys

        versions_dir = "alembic/versions"
        down_revs = []
        for fname in os.listdir(versions_dir):
            if not fname.endswith(".py") or fname.startswith("__"):
                continue
            content = open(os.path.join(versions_dir, fname)).read()
            m = re.search(r'^down_revision\s*=\s*["\'](\w+)["\']', content, re.MULTILINE)
            if m:
                down_revs.append((fname, m.group(1)))

        seen = {}
        dupes = []
        for fname, rev in down_revs:
            if rev in seen:
                dupes.append((rev, seen[rev], fname))
            seen[rev] = fname

        if dupes:
            for rev, f1, f2 in dupes:
                print(f"ERROR: two migrations share down_revision={rev!r}: {f1}, {f2}")
            sys.exit(1)

        print(f"OK: migration chain is linear ({len(down_revs)} migrations checked)")
        EOF

    - name: Run pre-commit hooks
      run: |
        pre-commit run --all-files

    - name: Run tests with coverage
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/prompt_ledger_test
        REDIS_URL: redis://localhost:6379/0
        OPENAI_API_KEY: sk-test-key-for-ci
      run: |
        pytest --cov=prompt_ledger --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 mypy

    - name: Check formatting with black
      run: black --check src/ tests/

    - name: Check import sorting with isort
      run: isort --check-only src/ tests/

    - name: Lint with flake8
      run: flake8 src/ tests/ --max-line-length=100 --extend-ignore=E203,W503

    - name: Type check with mypy
      run: mypy src/ --ignore-missing-imports
