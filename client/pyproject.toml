[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptledger-client"
version = "0.0.1"
description = "Python client SDK for PromptLedger — prompt registry, execution tracking, and lineage"
authors = [{name = "Martin", email = "martin@example.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.4.0",
]

[project.urls]
Homepage = "https://github.com/promptledger/PromptLedger"
Repository = "https://github.com/promptledger/PromptLedger"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["promptledger_client*"]
